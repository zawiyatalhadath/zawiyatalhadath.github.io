<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة — زاوية الحدث</title>
    <style>
        :root { --primary: #0d2b6b; --success: #009944; --bg: #f4f6f9; --border: #dce1e7; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #222; }
        .header { background: var(--primary); color: #fff; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 18px; }
        .btn-view { background: #1a4bb8; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 5px; font-size: 13px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h2 { margin-top: 0; font-size: 16px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; }
        label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-success { background: var(--success); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .news-item { border-bottom: 1px solid var(--border); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #dc3545; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        #statusMsg { padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h1>لوحة التحكم الشاملة — زاوية الحدث</h1>
    <a href="index.html" target="_blank" class="btn-view">معاينة الموقع ↗</a>
</div>

<div id="statusMsg"></div>

<div class="card">
    <h2>الربط مع GitHub</h2>
    <div class="row">
        <div class="col">
            <label>اسم المستخدم</label>
            <input type="text" id="ghUser" value="zawiyatalhadath">
        </div>
        <div class="col">
            <label>المستودع</label>
            <input type="text" id="ghRepo" value="zawiyatalhadath-github-io">
        </div>
    </div>
    <div style="margin-bottom: 10px;">
        <label>رمز الوصول (Token)</label>
        <input type="password" id="ghToken" placeholder="الصق رمز الوصول (ghp_...) هنا">
    </div>
    <button class="btn-primary" onclick="saveAndLoad()">حفظ الاتصال وتحميل البيانات</button>
</div>

<div class="card">
    <h2>نشر خبر جديد</h2>
    <div style="margin-bottom: 10px;">
        <label>عنوان الخبر</label>
        <input type="text" id="newsTitle" placeholder="اكتب عنوان الخبر هنا...">
    </div>
    <div class="row">
        <div class="col">
            <label>التصنيف</label>
            <select id="newsCategory">
                <option value="عاجل">عاجل</option>
                <option value="أخبار محلية">أخبار محلية</option>
                <option value="أخبار دولية">أخبار دولية</option>
                <option value="اقتصاد">اقتصاد</option>
                <option value="رياضة">رياضة</option>
            </select>
        </div>
        <div class="col">
            <label>رابط صورة (اختياري)</label>
            <input type="url" id="newsImage" placeholder="https://...">
        </div>
    </div>
    <div style="margin-bottom: 10px;">
        <label>أو اختر صورة من الاستوديو:</label>
        <input type="file" id="newsFile" accept="image/*">
    </div>
    <div style="margin-bottom: 10px;">
        <label>نص الخبر</label>
        <textarea id="newsBody" rows="4" placeholder="اكتب تفاصيل الخبر هنا..."></textarea>
    </div>
    <button class="btn-success" id="publishBtn" onclick="publishNews()">نشر الخبر الآن + إرسال لفيسبوك</button>
</div>

<div class="card">
    <h2>الأخبار المنشورة (<span id="newsCount">0</span>)</h2>
    <div id="newsList">لا توجد أخبار</div>
</div>

<script>
    let currentNews = [];
    let fileSha = "";

    function showStatus(msg, isError = false) {
        const el = document.getElementById('statusMsg');
        el.style.display = 'block';
        el.style.background = isError ? '#f8d7da' : '#d4edda';
        el.style.color = isError ? '#721c24' : '#155724';
        el.innerText = msg;
    }

    window.onload = () => {
        if (localStorage.getItem('ghUser')) document.getElementById('ghUser').value = localStorage.getItem('ghUser');
        if (localStorage.getItem('ghRepo')) document.getElementById('ghRepo').value = localStorage.getItem('ghRepo');
        if (localStorage.getItem('ghToken')) {
            document.getElementById('ghToken').value = localStorage.getItem('ghToken');
            loadNews();
        }
    };

    function saveAndLoad() {
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();

        if (!user || !repo || !token) {
            showStatus('يرجى تعبئة اسم المستخدم والمستودع ورمز الوصول (Token).', true);
            return;
        }

        localStorage.setItem('ghUser', user);
        localStorage.setItem('ghRepo', repo);
        localStorage.setItem('ghToken', token);
        showStatus('جاري الاتصال بـ GitHub وجلب البيانات...');
        loadNews();
    }

    async function loadNews() {
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();

        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/news.json?ref=main`, {
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });

            if (res.status === 404) {
                currentNews = [];
                fileSha = "";
                renderNews();
                showStatus('تم الاتصال بنجاح! ملف الأخبار فارغ وجاهز للنشر.');
                return;
            }

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.message || 'فشل الاتصال');
            }

            const data = await res.json();
            fileSha = data.sha;
            const decoded = decodeURIComponent(escape(atob(data.content)));
            currentNews = JSON.parse(decoded);
            renderNews();
            showStatus('تم الاتصال وتحميل الأخبار بنجاح!');
        } catch (err) {
            showStatus('خطأ في الاتصال: ' + err.message, true);
        }
    }

    function renderNews() {
        const list = document.getElementById('newsList');
        document.getElementById('newsCount').innerText = currentNews.length;
        if (currentNews.length === 0) {
            list.innerHTML = 'لا توجد أخبار';
            return;
        }
        list.innerHTML = currentNews.map((item, idx) => `
            <div class="news-item">
                <div>
                    <strong>[${item.category}] ${item.title}</strong><br>
                    <small style="color:#666">${item.date}</small>
                </div>
                <button class="btn-del" onclick="deleteNews(${idx})">حذف</button>
            </div>
        `).join('');
    }

    async function uploadImageToGitHub(file, user, repo, token) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async () => {
                const base64Content = reader.result.split(',')[1];
                const fileName = `images/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                try {
                    const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${fileName}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: 'Upload news image',
                            content: base64Content,
                            branch: 'main'
                        })
                    });
                    if (!res.ok) throw new Error('فشل رفع الصورة');
                    resolve(`https://raw.githubusercontent.com/${user}/${repo}/main/${fileName}`);
                } catch (e) {
                    reject(e);
                }
            };
            reader.readAsDataURL(file);
        });
    }

    async function publishNews() {
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();
        const title = document.getElementById('newsTitle').value.trim();
        const category = document.getElementById('newsCategory').value;
        const body = document.getElementById('newsBody').value.trim();
        let imageUrl = document.getElementById('newsImage').value.trim();
        const fileInput = document.getElementById('newsFile');

        if (!title || !body) {
            showStatus('يرجى إدخال عنوان الخبر ونص الخبر.', true);
            return;
        }

        const btn = document.getElementById('publishBtn');
        btn.disabled = true;
        btn.innerText = 'جاري النشر...';

        try {
            if (fileInput.files.length > 0) {
                showStatus('جاري رفع الصورة من الاستوديو...');
                imageUrl = await uploadImageToGitHub(fileInput.files[0], user, repo, token);
            }

            const newPost = {
                id: Date.now(),
                title,
                category,
                body,
                image: imageUrl || '',
                date: new Date().toLocaleDateString('ar-SY')
            };

            currentNews.unshift(newPost);
            await saveNewsToGitHub(user, repo, token);

            document.getElementById('newsTitle').value = '';
            document.getElementById('newsBody').value = '';
            document.getElementById('newsImage').value = '';
            fileInput.value = '';
            showStatus('تم نشر الخبر بنجاح على الموقع!');
        } catch (err) {
            showStatus('فشل النشر: ' + err.message, true);
        } finally {
            btn.disabled = false;
            btn.innerText = 'نشر الخبر الآن + إرسال لفيسبوك';
        }
    }

    async function deleteNews(index) {
        if (!confirm('هل أنت متأكد من حذف هذا الخبر؟')) return;
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();

        currentNews.splice(index, 1);
        try {
            await saveNewsToGitHub(user, repo, token);
            showStatus('تم حذف الخبر وتحديث الموقع.');
        } catch (err) {
            showStatus('خطأ أثناء الحذف: ' + err.message, true);
        }
    }

    async function saveNewsToGitHub(user, repo, token) {
        const jsonStr = JSON.stringify(currentNews, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonStr)));

        const payload = {
            message: 'Update news.json via Admin Panel',
            content: encodedContent,
            branch: 'main'
        };
        if (fileSha) payload.sha = fileSha;

        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/news.json`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.message || 'خطأ في الحفظ على GitHub');
        }

        const resData = await res.json();
        fileSha = resData.content.sha;
        renderNews();
    }
</script>

</body>
  </html>
