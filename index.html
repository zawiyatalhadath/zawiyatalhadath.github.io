<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الأخبار - الرئيسية</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background-color: #f4f6f9; color: #222; }
        header { background: #1e293b; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.4rem; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: #0f172a; }
        .card p { line-height: 1.6; color: #475569; white-space: pre-line; }
        .card small { color: #94a3b8; display: block; margin-top: 10px; }
        #admin-panel { display: none; background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #2563eb; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .actions { margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>شبكة الأخبار</h1>
    <button class="btn" onclick="toggleAdmin()">لوحة التحكم</button>
</header>

<div class="container">
    <!-- لوحة التحكم -->
    <div id="admin-panel">
        <h3>إضافة خبر جديد</h3>
        <input type="text" id="news-title" placeholder="عنوان الخبر">
        <textarea id="news-content" rows="4" placeholder="تفاصيل الخبر..."></textarea>
        <button class="btn" onclick="addNews()">نشر الخبر</button>
    </div>

    <!-- عرض الأخبار -->
    <div id="news-list">جاري تحميل الأخبار...</div>
</div>

<script>
    // تم ربط رابط قاعدة البيانات الخاص بك هنا
    const FIREBASE_URL = "https://news-site-f4efc-default-rtdb.firebaseio.com";
    let isAdmin = false;

    function toggleAdmin() {
        const panel = document.getElementById('admin-panel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            isAdmin = false;
            loadNews();
        } else {
            const pass = prompt("أدخل كلمة مرور الإدارة:");
            if (pass === "14761228811517") { // يمكنك تغيير كلمة المرور من هنا
                panel.style.display = 'block';
                isAdmin = true;
                loadNews();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }
    }

    async function loadNews() {
        const list = document.getElementById('news-list');
        try {
            const res = await fetch(`${FIREBASE_URL}/news.json`);
            const data = await res.json();
            list.innerHTML = "";
            if (!data) {
                list.innerHTML = "<div class='card'><p>لا توجد أخبار منشورة حالياً.</p></div>";
                return;
            }
            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const item = data[key];
                const deleteBtn = isAdmin ? `<div class="actions"><button class="btn btn-danger" onclick="deleteNews('${key}')">حذف الخبر</button></div>` : "";
                list.innerHTML += `
                    <div class="card">
                        <h2>${item.title}</h2>
                        <p>${item.content}</p>
                        <small>${item.date || ''}</small>
                        ${deleteBtn}
                    </div>
                `;
            });
        } catch (err) {
            list.innerHTML = "<div class='card'><p>حدث خطأ أثناء الاتصال بقاعدة البيانات.</p></div>";
        }
    }

    async function addNews() {
        const title = document.getElementById('news-title').value.trim();
        const content = document.getElementById('news-content').value.trim();
        if (!title || !content) return alert("يرجى كتابة العنوان والتفاصيل");

        const date = new Date().toLocaleString('ar-EG');
        await fetch(`${FIREBASE_URL}/news.json`, {
            method: 'POST',
            body: JSON.stringify({ title, content, date })
        });

        document.getElementById('news-title').value = "";
        document.getElementById('news-content').value = "";
        loadNews();
    }

    async function deleteNews(key) {
        if (!confirm("هل أنت متأكد من حذف هذا الخبر؟")) return;
        await fetch(`${FIREBASE_URL}/news/${key}.json`, { method: 'DELETE' });
        loadNews();
    }

    loadNews();
</script>

</body>
</html>
