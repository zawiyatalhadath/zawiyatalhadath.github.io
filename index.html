<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زاوية الحدث | تغطية إخبارية شاملة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f4f5f7;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --accent-orange: #ea580c;
      --accent-red: #dc2626;
      --dark-panel: #0a0a0a;
      --shadow: 0 2px 10px rgba(0,0,0,0.06);
    }

    body.dark-mode {
      --bg-body: #0f1115;
      --bg-card: #181b20;
      --bg-header: #14171c;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #272b33;
      --shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg-body);
      color: var(--text-main);
      transition: background 0.25s, color 0.25s;
      padding-bottom: 70px;
    }

    .hidden { display: none !important; }

    /* الشريط العلوي الأسود */
    .top-bar {
      background: #000000;
      color: #e5e7eb;
      font-size: 12px;
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-bar span.live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      margin-left: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* الهيدر الرئيسي */
    header.main-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .brand-logo {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-logo h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .brand-logo span {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-orange);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-action {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      gap: 2px;
    }
    .icon-action svg {
      width: 20px;
      height: 20px;
    }

    .saved-pill {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* شريط البحث المنسدل */
    .search-bar {
      background: var(--bg-card);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }
    .search-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-body);
      color: var(--text-main);
      font-size: 14px;
    }

    /* شريط الأخبار العاجلة المتحرك */
    .ticker-wrap {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      height: 38px;
      overflow: hidden;
    }
    .ticker-label {
      background: var(--accent-red);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      z-index: 2;
    }
    .ticker-content {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .ticker-move {
      display: inline-block;
      padding-right: 100%;
      animation: tickerScroll 28s linear infinite;
      font-size: 13px;
      font-weight: 600;
    }
    .ticker-wrap.paused .ticker-move {
      animation-play-state: paused;
    }
    .ticker-item {
      margin-left: 35px;
      cursor: pointer;
    }
    .ticker-item:hover { color: var(--accent-orange); }
    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }
    .ticker-pause {
      background: var(--bg-card);
      border: none;
      border-right: 1px solid var(--border-color);
      color: var(--text-main);
      height: 100%;
      padding: 0 12px;
      cursor: pointer;
      font-weight: bold;
    }

    /* القائمة الجانبية السوداء */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
    }
    .side-drawer {
      position: fixed;
      top: 0;
      right: -300px;
      width: 285px;
      max-width: 85vw;
      height: 100%;
      background: #080808;
      color: #ffffff;
      z-index: 201;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .side-drawer.open { right: 0; }

    .drawer-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }
    .drawer-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .theme-switch-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #121212;
      border-bottom: 1px solid #222;
      font-size: 13px;
    }
    .theme-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }
    .theme-btn.active { color: #fff; }

    .drawer-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .drawer-list li {
      border-bottom: 1px solid #1c1c1c;
    }
    .drawer-list button {
      width: 100%;
      background: none;
      border: none;
      color: #f3f4f6;
      padding: 15px 18px;
      text-align: right;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-list button.active {
      color: var(--accent-orange);
      background: #141414;
    }

    /* الحاوية الرئيسية */
    .container {
      max-width: 960px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-right: 4px solid var(--accent-orange);
      padding-right: 10px;
    }
    .section-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    /* شبكة الأخبار */
    .news-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 680px) {
      .news-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .news-card.featured {
        grid-column: span 2;
      }
    }

    .news-card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.15s;
    }
    .news-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      cursor: pointer;
    }
    .news-card.featured .news-card-img {
      height: 270px;
    }
    .news-card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .cat-tag {
      display: inline-block;
      background: var(--bg-body);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      align-self: flex-start;
    }
    .cat-tag.urgent {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fecaca;
    }
    .news-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
      cursor: pointer;
    }
    .news-card.featured h3 { font-size: 21px; }
    .news-card h3:hover { color: var(--accent-orange); }

    .news-excerpt {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .mini-actions {
      display: flex;
      gap: 8px;
    }
    .mini-btn {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-btn.share-orange {
      background: var(--accent-orange);
      color: #fff;
      border-color: var(--accent-orange);
    }

    /* صفحة عرض تفاصيل الخبر الكامل */
    .article-view {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }
    .back-btn {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .article-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.4;
      margin: 8px 0 12px;
    }
    .article-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .share-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .share-btn-main {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bookmark-btn {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    /* أزرار الاشتراك والمتابعة */
    .follow-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .follow-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .follow-btn.whatsapp { border-color: #25D366; }
    .follow-btn.whatsapp span.icon-wa {
      background: #25D366;
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* بطاقة الخلاصة السوداء */
    .summary-box {
      background: #0a0a0a;
      color: #f9fafb;
      border-radius: 12px;
      padding: 14px 16px;
      margin: 16px 0;
      border: 1px solid #262626;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .summary-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
    }
    .summary-icon {
      background: var(--accent-orange);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .summary-body {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.75;
      color: #e5e7eb;
    }
    .summary-note {
      margin-top: 10px;
      font-size: 11px;
      color: #9ca3af;
    }

    .article-main-img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 10px;
      margin: 12px 0;
    }
    .article-body-text {
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-line;
      margin-top: 14px;
    }

    /* الزر العائم: الأخبار باختصار */
    .floating-brief-btn {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: #0a0a0a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 30px;
      padding: 8px 14px 8px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      cursor: pointer;
      z-index: 95;
    }
    .floating-brief-btn .play-circle {
      background: var(--accent-orange);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* نافذة منبثقة للمشاركة والموجز والاشتراك */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; }
    }
    .modal-sheet {
      background: var(--bg-card);
      color: var(--text-main);
      width: 100%;
      max-width: 480px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }
    @media (min-width: 600px) {
      .modal-sheet { border-radius: 14px; }
    }
    .share-links-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .social-share-item {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    /* لوحة الإدارة والإحصائيات الخاصة بالمدير */
    .admin-box {
      background: var(--bg-card);
      border: 2px solid var(--accent-orange);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .admin-box h2 { margin-top: 0; font-size: 18px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 16px;
    }
    .stat-card {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-num {
      display: block;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-orange);
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }
    label { display: block; margin: 10px 0 4px; font-weight: 700; font-size: 13px; }
    .admin-box input, .admin-box select, .admin-box textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      background: var(--bg-body);
      color: var(--text-main);
    }
    .admin-box textarea { min-height: 110px; resize: vertical; }
    .btn {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    .btn-primary { background: #1d4ed8; color: #fff; width: 100%; }
    .btn-success { background: #15803d; color: #fff; width: 100%; }
    .btn-danger { background: #dc2626; color: #fff; padding: 5px 10px; font-size: 12px; margin-top: 0; }
    .btn-logout { background: #475569; color: #fff; float: left; margin-top: 0; padding: 6px 12px; font-size: 12px; }
    .error { color: #dc2626; font-size: 13px; margin-top: 8px; text-align: center; }
    .success { color: #15803d; font-size: 13px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="top-bar">
  <div><span class="live-dot"></span> تغطية مستمرة | <span id="todayDateStr"></span></div>
  <div style="cursor:pointer;" onclick="openSubscribeModal()">🔔 اشترك بالتنبيهات</div>
</div>

<!-- الهيدر الرئيسي -->
<header class="main-header">
  <div class="header-right">
    <button class="menu-btn" id="openDrawerBtn" aria-label="القائمة">☰</button>
    <div class="brand-logo" onclick="goHome()">
      <h1>زاوية الحدث</h1>
      <span>بإدارة محمد كريم</span>
    </div>
  </div>

  <div class="header-left">
    <button class="icon-action" onclick="toggleSearch()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>البحث</span>
    </button>
    <button class="saved-pill" onclick="showSavedNews()">
      <span>قائمتي</span>
      <span id="savedCount">(0)</span>
    </button>
  </div>
</header>

<!-- شريط البحث -->
<div id="searchBar" class="search-bar hidden">
  <input type="text" id="searchInput" placeholder="ابحث في عناوين وتفاصيل الأخبار..." oninput="handleSearch()" />
  <button class="mini-btn" onclick="clearSearch()">إغلاق</button>
</div>

<!-- شريط الأخبار المتحرك -->
<div class="ticker-wrap" id="tickerWrap">
  <div class="ticker-label">عاجل</div>
  <div class="ticker-content">
    <div class="ticker-move" id="tickerMove">جاري تحميل آخر المستجدات من زاوية الحدث...</div>
  </div>
  <button class="ticker-pause" id="tickerPauseBtn" onclick="toggleTicker()">❚❚</button>
</div>

<!-- القائمة الجانبية السوداء -->
<div id="drawerOverlay" class="drawer-overlay hidden" onclick="closeDrawer()"></div>
<aside id="sideDrawer" class="side-drawer">
  <div class="drawer-header">
    <div>
      <strong style="font-size:18px;">زاوية الحدث</strong>
      <div style="font-size:11px; color:#ea580c;">أقسام الموقع</div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>

  <div class="theme-switch-bar">
    <button class="theme-btn active" id="lightThemeBtn" onclick="setTheme('light')">☀ نمط
