<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زاوية الحدث</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    header {
      background: #0f172a;
      color: #fff;
      padding: 16px;
      text-align: center;
      border-bottom: 3px solid #dc2626;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 6px 0 0; font-size: 13px; color: #cbd5e1; }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: #fff;
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    nav button {
      border: none;
      background: #e5e7eb;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
    }
    nav button.active {
      background: #dc2626;
      color: #fff;
      font-weight: bold;
    }
    .container { max-width: 900px; margin: 16px auto; padding: 0 12px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      background: #fee2e2;
      color: #b91c1c;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .date { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .hidden { display: none !important; }

    /* لوحة الإدارة */
    .admin-box {
      background: #fff;
      border: 2px solid #0f172a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .admin-box h2 { margin-top: 0; font-size: 18px; color: #0f172a; }
    label { display: block; margin: 10px 0 4px; font-weight: bold; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .btn {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    .btn-primary { background: #1d4ed8; color: #fff; width: 100%; }
    .btn-success { background: #15803d; color: #fff; width: 100%; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 13px; margin-top: 8px; }
    .btn-logout { background: #475569; color: #fff; float: left; margin-top: 0; padding: 6px 12px; font-size: 13px; }
    .error { color: #dc2626; font-size: 13px; margin-top: 8px; text-align: center; }
    .success { color: #15803d; font-size: 13px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

<header>
  <h1>زاوية الحدث</h1>
  <p>تغطية إخبارية شاملة ومستمرة - بإدارة محمد كريم</p>
</header>

<nav id="categoryNav">
  <button class="active" data-cat="الكل">الكل</button>
  <button data-cat="عاجل">عاجل</button>
  <button data-cat="محلية">محلية</button>
  <button data-cat="اقتصاد">اقتصاد</button>
  <button data-cat="أسواق">أسواق</button>
  <button data-cat="اتصالات">اتصالات</button>
  <button data-cat="منوعات">منوعات</button>
</nav>

<div class="container">

  <!-- صندوق تسجيل الدخول للإدارة (مخفي افتراضياً) -->
  <div id="loginSection" class="admin-box hidden">
    <h2>تسجيل دخول الإدارة</h2>
    <label>البريد الإلكتروني</label>
    <input type="email" id="adminEmail" placeholder="أدخل البريد الإلكتروني..." />
    <label>كلمة المرور</label>
    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور..." />
    <button class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
    <div id="loginMsg" class="error"></div>
  </div>

  <!-- لوحة التحكم لإضافة الأخبار (تظهر فقط بعد تسجيل الدخول) -->
  <div id="dashboardSection" class="admin-box hidden">
    <button class="btn btn-logout" id="logoutBtn">تسجيل الخروج</button>
    <h2>نشر خبر جديد</h2>
    <label>القسم</label>
    <select id="newsCategory">
      <option value="عاجل">عاجل</option>
      <option value="محلية">محلية</option>
      <option value="اقتصاد">اقتصاد</option>
      <option value="أسواق">أسواق</option>
      <option value="اتصالات">اتصالات</option>
      <option value="منوعات">منوعات</option>
    </select>
    <label>عنوان الخبر</label>
    <input type="text" id="newsTitle" placeholder="اكتب عنوان الخبر..." />
    <label>رابط الصورة (اختياري)</label>
    <input type="url" id="newsImage" placeholder="https://example.com/image.jpg" />
    <label>تفاصيل الخبر</label>
    <textarea id="newsContent" placeholder="اكتب نص الخبر كاملاً..."></textarea>
    <button class="btn btn-success" id="publishBtn">نشر الخبر الآن</button>
    <div id="publishMsg" class="success"></div>
  </div>

  <!-- قائمة الأخبار للزوار -->
  <div id="newsFeed">
    <p style="text-align:center; color:#6b7280;">جاري تحميل الأخبار...</p>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4DiuqBE2seftZOe4TtCT-Mtwvhh7A_BM",
    authDomain: "news-site-f4efc.firebaseapp.com",
    databaseURL: "https://news-site-f4efc-default-rtdb.firebaseio.com",
    projectId: "news-site-f4efc",
    storageBucket: "news-site-f4efc.firebasestorage.app",
    messagingSenderId: "644937766713",
    appId: "1:644937766713:web:bc55a35eebedbe46c1bae8",
    measurementId: "G-65MJ96EGXD"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const urlParams = new URLSearchParams(window.location.search);
  const isAdminRoute = urlParams.get('admin') === '1';

  const loginSection = document.getElementById('loginSection');
  const dashboardSection = document.getElementById('dashboardSection');
  const loginMsg = document.getElementById('loginMsg');
  const publishMsg = document.getElementById('publishMsg');
  const newsFeed = document.getElementById('newsFeed');

  let currentUser = null;
  let allNews = [];
  let selectedCategory = 'الكل';

  // مراقبة حالة تسجيل الدخول
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
    } else {
      dashboardSection.classList.add('hidden');
      if (isAdminRoute) {
        loginSection.classList.remove('hidden');
      } else {
        loginSection.classList.add('hidden');
      }
    }
    renderNews();
  });

  // تسجيل الدخول
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value.trim();
    loginMsg.textContent = '';

    if (!email || !password) {
      loginMsg.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور.';
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      loginMsg.textContent = 'خطأ في البريد الإلكتروني أو كلمة المرور. تأكد من البيانات.';
      console.error(error);
    }
  });

  // تسجيل الخروج
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
  });

  // نشر خبر جديد
  document.getElementById('publishBtn').addEventListener('click', async () => {
    const category = document.getElementById('newsCategory').value;
    const title = document.getElementById('newsTitle').value.trim();
    const image = document.getElementById('newsImage').value.trim();
    const content = document.getElementById('newsContent').value.trim();
    publishMsg.textContent = '';

    if (!title || !content) {
      alert('يرجى إدخال عنوان الخبر وتفاصيله.');
      return;
    }

    try {
      await push(ref(db, 'news'), {
        category,
        title,
        image,
        content,
        createdAt: Date.now()
      });
      document.getElementById('newsTitle').value = '';
      document.getElementById('newsImage').value = '';
      document.getElementById('newsContent').value = '';
      publishMsg.textContent = 'تم نشر الخبر بنجاح!';
      setTimeout(() => publishMsg.textContent = '', 3000);
    } catch (error) {
      alert('حدث خطأ أثناء النشر: ' + error.message);
    }
  });

  // جلب الأخبار وعرضها
  onValue(ref(db, 'news'), (snapshot) => {
    const data = snapshot.val();
    allNews = [];
    if (data) {
      Object.keys(data).forEach(key => {
        allNews.push({ id: key, ...data[key] });
      });
      allNews.sort((a, b) => b.createdAt - a.createdAt);
    }
    renderNews();
  });

  function renderNews() {
    const filtered = selectedCategory === 'الكل'
      ? allNews
      : allNews.filter(item => item.category === selectedCategory);

    if (filtered.length === 0) {
      newsFeed.innerHTML = '<p style="text-align:center; color:#6b7280;">لا توجد أخبار في هذا القسم حالياً.</p>';
      return;
    }

    newsFeed.innerHTML = '';
    filtered.forEach(item => {
      const dateStr = new Date(item.createdAt).toLocaleString('ar-SY', {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        ${item.image ? `<img src="${item.image}" alt="صورة الخبر" onerror="this.style.display='none'">` : ''}
        <span class="badge">${item.category}</span>
        <div class="date">${dateStr}</div>
        <h3 style="margin: 0 0 8px;">${item.title}</h3>
        <p style="margin: 0; line-height: 1.6; white-space: pre-line;">${item.content}</p>
        ${currentUser ? `<button class="btn btn-danger" onclick="deleteNews('${item.id}')">حذف الخبر</button>` : ''}
      `;
      newsFeed.appendChild(card);
    });
  }

  window.deleteNews = async (id) => {
    if (confirm('هل أنت متأكد من حذف هذا الخبر؟')) {
      await remove(ref(db, 'news/' + id));
    }
  };

  // تبديل الأقسام
  document.querySelectorAll('#categoryNav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#categoryNav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.getAttribute('data-cat');
      renderNews();
    });
  });
</script>

</body>
</html>
