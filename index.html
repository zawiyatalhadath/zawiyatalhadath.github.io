<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زاوية الحدث | الخبر كما هو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d00;
            --dark: #111111;
            --bg: #f5f6f8;
            --card: #ffffff;
            --border: #e5e7eb;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #2563eb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--dark);
            padding-bottom: 80px;
        }

        /* الشريط العلوي الأسود للزوار */
        .top-bar {
            background-color: #000;
            color: #fff;
            padding: 7px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .fb-top-link {
            color: #fff;
            text-decoration: none;
            background: #1877f2;
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
        }

        /* الهيدر الرئيسي */
        .main-header {
            background-color: #fff;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-btn {
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--dark);
        }
        .logo {
            cursor: pointer;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.1;
        }
        .logo span {
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            display: block;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-toggle {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
        }
        .my-list-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* شريط البورصة والأسواق */
        .ticker-bar {
            background-color: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            height: 40px;
            overflow: hidden;
        }
        .ticker-pause {
            background: #fff;
            border: none;
            border-left: 1px solid var(--border);
            padding: 0 12px;
            height: 100%;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
        }
        .ticker-track {
            display: flex;
            gap: 25px;
            padding: 0 15px;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
            font-size: 13px;
            font-weight: 700;
        }
        .ticker-track.paused {
            animation-play-state: paused;
        }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .up { color: var(--green); }
        .down { color: var(--red); }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }

        /* شريط الأقسام */
        .categories-bar {
            background: #fff;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
        }
        .cat-btn {
            background: #f1f3f5;
            border: none;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--dark);
            color: #fff;
        }

        /* صندوق البحث */
        .search-box {
            display: none;
            padding: 10px 15px;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        /* بانر الإعلانات */
        .ads-wrapper {
            max-width: 750px;
            margin: 12px auto 0;
            padding: 0 12px;
        }
        .ad-banner {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: #fff;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-right: 5px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .ad-tag {
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .ad-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }
        .ad-desc {
            font-size: 12px;
            color: #d1d5db;
        }
        .ad-cta {
            background: var(--green);
            color: #fff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        /* نافذة تسجيل الدخول السرية */
        .login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .login-box {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .login-box h3 {
            margin-bottom: 15px;
            text-align: center;
            font-size: 19px;
        }

        /* لوحة تحكم المدير والمحررين */
        .admin-panel {
            display: none;
            background: #fff;
            margin: 15px auto;
            max-width: 750px;
            padding: 18px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .panel-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #f1f3f5;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        /* صندوق رفع الصور في لوحة التحكم */
        .image-upload-box {
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .upload-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .studio-btn {
            background: var(--blue);
            color: #fff;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }
        .img-preview-wrap {
            display: none;
            position: relative;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .img-preview-wrap img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            display: block;
        }
        .remove-img-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .publish-btn {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }
        .list-item-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #fafafa;
            gap: 10px;
        }

        /* حاوية الأخبار */
        .container {
            max-width: 750px;
            margin: 15px auto;
            padding: 0 12px;
        }

        /* بطاقة الخبر */
        .news-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .card-img {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .card-body {
            padding: 16px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
            background: #f1f3f5;
            color: #333;
        }
        .badge.urgent {
            background: #fee2e2;
            color: var(--red);
        }
        .news-title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.45;
            margin-bottom: 8px;
            color: #000;
            cursor: pointer;
        }
        .news-excerpt {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .news-meta {
            font-size: 12px;
            color: #777;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* أزرار البطاقة */
        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid #f1f1f1;
            padding-top: 12px;
        }
        .btn {
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-read { background: #111; color: #fff; }
        .btn-save { background: #f3f4f6; color: #111; border: 1px solid #ddd; }
        .btn-save.saved { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
        .btn-share { background: var(--primary); color: #fff; }
        .btn-edit { background: var(--blue); color: #fff; display: none; }
        .btn-delete { background: var(--red); color: #fff; display: none; }

        body.logged-in .btn-edit,
        body.logged-in .btn-delete {
            display: inline-flex;
        }

        /* تذييل الموقع */
        .site-footer {
            background: #111;
            color: #fff;
            padding: 25px 15px;
            margin-top: 30px;
        }
        .footer-inner {
            max-width: 750px;
            margin: 0 auto;
        }
        .footer-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1f2937;
            color: #fff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid #374151;
        }
        .copyright {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            border-top: 1px solid #222;
            padding-top: 15px;
        }

        /* نافذة قراءة الخبر الكامل */
        .article-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            z-index: 2000;
            overflow-y: auto;
            padding: 20px 15px 90px;
        }
        .modal-inner {
            max-width: 720px;
            margin: 0 auto;
        }
        .back-btn {
            background: #f1f3f5;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 800;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .full-title {
            font-size: 24px;
            font-weight: 900;
            line-height: 1.4;
            margin: 10px 0;
        }
        .modal-full-img {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 12px;
            margin: 12px 0;
            display: none;
        }
        .summary-box {
            background: #0d0d0d;
            color: #fff;
            border-radius: 14px;
            padding: 18px;
            margin: 18px 0;
        }
        .summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--primary);
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
        }
        .summary-text {
            font-size: 15px;
            line-height: 1.7;
            color: #f3f4f6;
        }
        .full-body {
            font-size: 17px;
            line-height: 1.9;
            color: #1f2937;
            white-space: pre-line;
        }

        /* الزر العائم بالأسفل */
        .floating-brief {
            position: fixed;
            bottom: 18px;
            left: 18px;
            background: #111;
            color: #fff;
            padding: 8px 16px 8px 8px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1500;
            border: none;
            cursor: pointer;
        }
        .play-icon {
            background: var(--primary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي للزوار -->
    <div class="top-bar">
        <div>حمص • <span id="current-date"></span></div>
        <a href="#" id="top-fb-link" target="_blank" class="fb-top-link">تابعنا على فيسبوك</a>
    </div>

    <!-- الهيدر -->
    <header class="main-header">
        <div class="header-right">
            <button class="menu-btn" onclick="filterCategory('الكل')">☰</button>
            <div class="logo" onclick="filterCategory('الكل')">
                <h1>زاوية الحدث</h1>
                <span>تغطية إخبارية واقتصادية شاملة</span>
            </div>
        </div>
        <div class="header-left">
            <button class="search-toggle" onclick="toggleSearch()">
                <span>🔍</span>
                <span>البحث</span>
            </button>
            <button class="my-list-btn" onclick="showSavedOnly()">قائمتي (<span id="saved-count">0</span>)</button>
        </div>
    </header>

    <!-- شريط البورصة المباشر -->
    <div class="ticker-bar">
        <button class="ticker-pause" id="pause-btn" onclick="toggleTicker()">❚❚</button>
        <div class="ticker-track" id="ticker-track">
            <span class="ticker-item">ذهب (Comex): <strong id="gold-price">3,620.60$</strong> <span class="up">▲ +1.60%</span></span>
            <span class="ticker-item">مزيج برنت (نفط): <strong>95.25$</strong> <span class="up">▲ +0.68%</span></span>
            <span class="ticker-item">بيتكوين (BTC): <strong id="btc-price">جاري التحديث...</strong> <span id="btc-change" class="up">▲</span></span>
            <span class="ticker-item">إيثيريوم (ETH): <strong id="eth-price">جاري التحديث...</strong> <span id="eth-change" class="up">▲</span></span>
            <span class="ticker-item">مؤشر البورصة العام: <strong>16,720.50</strong> <span class="up">▲ +0.90%</span></span>
        </div>
    </div>

    <!-- شريط الأقسام -->
    <nav class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الرئيسية</button>
        <button class="cat-btn" onclick="filterCategory('عاجل', this)">عاجل</button>
        <button class="cat-btn" onclick="filterCategory('أسواق', this)">أسواق وبورصة</button>
        <button class="cat-btn" onclick="filterCategory('اقتصاد', this)">اقتصاد</button>
        <button class="cat-btn" onclick="filterCategory('عام', this)">أخبار عامة</button>
    </nav>

    <!-- مربع البحث -->
    <div class="search-box" id="search-box">
        <input type="text" id="search-input" placeholder="ابحث في عناوين وتفاصيل
